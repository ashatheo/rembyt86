<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спасибо! | РемБыт 86</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Manrope', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at 15% 20%, #16274a, #0b1930 60%);
            text-align: center;
            margin: 0;
            padding: 20px;
            color: #fff;
        }
        .box { max-width: 500px; }
        .icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 64px; height: 64px; border-radius: 50%;
            background: rgba(255, 106, 26, 0.15); color: #ff6a1a;
            font-size: 1.8rem; margin-bottom: 25px;
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            margin-bottom: 20px;
        }
        p {
            color: #93a2c2;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">✓</div>
        <h1>Заявка принята!</h1>
        <p>Мы уже получили её — перезвоним в течение 10 минут, чтобы согласовать удобное время выезда мастера.</p>
        <p style="margin-top: 30px; opacity: 0.7; font-size: 0.95rem;">Сейчас вы будете перенаправлены на главную...</p>
    </div>
    <script>
        setTimeout(function() {
            window.location.href = 'index.html';
        }, 4000);
    </script>
</body>
</html>
